name: Release Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and package
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Read and validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content src/RagnarokCompanion/RagnarokCompanion.csproj
          $expected = 'v' + $project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:RELEASE_TAG -cne $expected) { throw "A tag deve corresponder à versão do projeto: $expected" }
          "release_tag=$expected" >> $env:GITHUB_OUTPUT
      - name: Download authorized public SQLite (no private source files)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $data = Get-Content build/item-database.json -Raw | ConvertFrom-Json
          $folder = 'src/RagnarokCompanion/Data'
          gh release download $data.ReleaseTag --pattern $data.AssetName --dir $folder
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível obter o banco público autorizado.' }
          $download = Join-Path $folder $data.AssetName
          if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ine $data.Sha256) { throw 'SHA256 do banco público divergente; publicação interrompida.' }
          Move-Item -LiteralPath $download -Destination (Join-Path $folder 'farmland-items.sqlite')
      - name: Build user package with tests and offline WPF smoke
        run: ./build-release.ps1 -SdkPath (Get-Command dotnet).Source
      - name: Upload user package
        uses: actions/upload-artifact@v4
        with:
          name: FarmlandCompanion-win-x64
          path: |
            artifacts/release/FarmlandCompanion-win-x64.zip
            artifacts/release/FarmlandCompanion-win-x64.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FarmlandCompanion-win-x64
          path: package
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd package
          sha256sum --check FarmlandCompanion-win-x64.sha256
          cat > release-notes.md <<'NOTES'
          ## Baixar e executar

          1. Baixe **FarmlandCompanion-win-x64.zip** nos arquivos abaixo.
          2. Extraia todo o ZIP e abra **FarmlandCompanion.exe**.

          Windows 11 x64. Não precisa instalar .NET. Mantenha FarmlandUpdater.exe e as pastas Data, docs e licenses junto do aplicativo.

          A partir desta versão, use **⬆ Atualizar** no aplicativo ou **Configurações → Atualizações** para instalar futuras versões automaticamente. Na primeira instalação, use **Sair** na bandeja da versão anterior antes de abrir a nova. Suas configurações e sua chave API continuam na pasta de dados do Windows; não fazem parte deste pacote.

          O arquivo `.sha256` permite conferir a integridade do download. Os arquivos automáticos **Source code** são destinados a desenvolvedores.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG já existe. Incremente Version para publicar outra versão."
            exit 0
          fi
          gh release create "$RELEASE_TAG" FarmlandCompanion-win-x64.zip FarmlandCompanion-win-x64.sha256 --target "$RELEASE_COMMIT" --title "Farmland Companion $RELEASE_TAG" --notes-file release-notes.md --latest
