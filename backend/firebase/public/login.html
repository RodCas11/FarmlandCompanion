<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Farmland Companion · Login</title>
<style>body{background:#101522;color:#eee;font:16px system-ui;max-width:460px;margin:12vh auto;padding:28px}button{background:#d8b36c;border:0;border-radius:8px;padding:14px;font:inherit;cursor:pointer}p{line-height:1.6;color:#bcc4d5}</style>
<h1>Farmland Companion</h1><p>Entre com Google para conectar o aplicativo. Nenhuma build será publicada durante o login.</p><button id="login" disabled>Entrar com Google</button><p id="status">Preparando login…</p>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,setPersistence,inMemoryPersistence,signOut} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js';
const status=document.getElementById('status'),button=document.getElementById('login');
try{
 const args=new URLSearchParams(location.hash.slice(1)),port=args.get('port'),state=args.get('state');history.replaceState(null,'',location.pathname);
 if(!/^\d{4,5}$/.test(port)||Number(port)>65535||!/^[A-F0-9]{64}$/.test(state))throw Error('Abra esta página pelo botão Entrar com Google do Companion.');
 const config=await (await fetch('/firebase-config.json',{cache:'no-store'})).json(),auth=getAuth(initializeApp(config));await setPersistence(auth,inMemoryPersistence);button.disabled=false;status.textContent='Clique para conectar sua conta.';
 button.onclick=async()=>{button.disabled=true;let phase='google';try{const credential=await signInWithPopup(auth,new GoogleAuthProvider());phase='callback';status.textContent='Google conectado. Conectando ao Companion…';const response=await fetch(`http://127.0.0.1:${port}/callback`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state,idToken:await credential.user.getIdToken(),refreshToken:credential.user.refreshToken})});if(!response.ok)throw {code:'companion/http-'+response.status};await signOut(auth);status.textContent='Conta conectada! Pode fechar esta aba e voltar ao Companion.';}catch(e){const code=typeof e?.code==='string'&&/^[a-z0-9\/-]+$/i.test(e.code)?e.code:(phase==='callback'?'companion/local-connection':'auth/unknown');const messages={'auth/unauthorized-domain':'Autorize farmland-companion.web.app em Firebase Console → Authentication → Settings → Authorized domains.','auth/operation-not-allowed':'Ative Google em Firebase Console → Authentication → Sign-in method.','auth/popup-blocked':'Permita pop-ups neste site e tente novamente.','auth/popup-closed-by-user':'A janela do Google foi fechada. Clique para tentar novamente.','auth/cancelled-popup-request':'Outro login foi iniciado. Tente novamente.','auth/invalid-api-key':'Confira a configuração Web publicada no Hosting.','auth/configuration-not-found':'Confira a configuração do Firebase Authentication deste projeto.','auth/network-request-failed':'Não foi possível acessar o Google/Firebase. Confira a conexão.','companion/local-connection':'Google conectado, mas o navegador não alcançou o Companion. Permita o acesso à rede local e reinicie o login pelo aplicativo (o prazo é de 3 minutos).'};status.textContent=(messages[code]||(phase==='callback'?'O Companion recusou a conexão. Reinicie o login pelo aplicativo.':'Falha no login Google. Confira a configuração do Authentication.'))+' Código: '+code; button.disabled=false;}};
}catch(e){status.textContent=e.message;}
</script></html>
